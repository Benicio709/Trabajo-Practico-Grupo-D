<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
 <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
    <header>
       <section class="Logo">
           <img src="img/LogoMS.jpeg" alt="Mano Solidarias Logo" style="width: 50px; height: 50px;">
           <a href="index.html">Por Una Vida Más</a> 
        </section>
    </header>
    <main>
        <form action="https://formspree.io/f/mayvlgqj" method="POST">
            <h1>¡Únete a nuestra causa!</h1>
            <p>Completa el formulario para ser parte de nuestro equipo de voluntarios y ayudar a construir un futuro sin hambre.</p>
            <label for="name">Nombre Completo:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="_replyto" required>
            
            <label for="message">¿Por qué quieres unirte?</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            
            <button type="submit">Enviar</button>
        </form>
    </main> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
</body>
</html>
